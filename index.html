<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Aurora | Manga Art Sketchbook</title>
  <meta name="description" content="An interactive animated manga sketchbook showing animated stroke-by-stroke drawings.">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Outfit:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Background Halftone Screen Tone Overlay -->
  <div class="screentone-overlay"></div>

  <!-- App Wrapper -->
  <div class="app-container">
    
    <!-- Manga Header Panel -->
    <header class="app-header glass-panel">
      <div class="header-left">
        <span class="jp-logo">極光</span>
        <h1>Aurora Sketchbook</h1>
      </div>
      <div class="header-right">
        <div class="status-indicator">
          <span class="pulse-dot"></span>
          <span>Drawing Playback Active</span>
        </div>
      </div>
    </header>

    <!-- Main Workspace Grid -->
    <main class="workspace">
      
      <!-- LEFT SIDEBAR: MANGA CONTROLS -->
      <aside class="control-sidebar glass-panel">
        <div class="sidebar-header">
          <span class="jp-label">操作パネル</span>
          <h3>Sketch Controls</h3>
        </div>

        <div class="control-group">
          <label>Choose Artwork</label>
          <div class="artwork-list">
            <button class="artwork-btn active" data-sketch="sakura">
              <span class="art-num">01</span>
              <div class="art-details">
                <h4>Sakura Torii</h4>
                <p>Zen shrine silhouette</p>
              </div>
            </button>
            <button class="artwork-btn" data-sketch="ninja">
              <span class="art-num">02</span>
              <div class="art-details">
                <h4>Cyber Ninja</h4>
                <p>Action panel drawing</p>
              </div>
            </button>
            <button class="artwork-btn" data-sketch="eye">
              <span class="art-num">03</span>
              <div class="art-details">
                <h4>Manga Eye</h4>
                <p>Expressive ink details</p>
              </div>
            </button>
          </div>
        </div>

        <div class="control-group">
          <label>Playback Actions</label>
          <div class="playback-controls">
            <button id="btn-play" class="playback-btn primary-btn"><i data-lucide="play"></i> Draw Sketch</button>
            <button id="btn-clear" class="playback-btn text-btn"><i data-lucide="rotate-ccw"></i> Restart</button>
          </div>
        </div>

        <div class="control-group">
          <label>Interactive Canvas Trace</label>
          <div class="toggle-card">
            <div class="toggle-info">
              <h4>Stylus Overlays</h4>
              <p>Enable manual sketching & tracing directly over the animated panels.</p>
            </div>
            <button id="btn-toggle-trace" class="toggle-switch active">Active</button>
          </div>
        </div>

        <!-- Float Sound Effects panel -->
        <div class="control-group">
          <label>Manga SFX Soundwaves</label>
          <div class="sfx-buttons">
            <button class="sfx-tag" data-sfx="gogo">ゴゴゴ (Rumble)</button>
            <button class="sfx-tag" data-sfx="don">ドン (Boom)</button>
            <button class="sfx-tag" data-sfx="suu">スッ (Swoosh)</button>
          </div>
        </div>
      </aside>

      <!-- MIDDLE: CORE SKETCH CANVAS -->
      <section class="sketch-stage">
        
        <!-- Animated Drawing Panel -->
        <div class="manga-panel" id="manga-panel-element">
          <!-- The SVG animated paths load here -->
          <div class="svg-container" id="svg-mount"></div>

          <!-- User Trace Canvas -->
          <canvas id="trace-canvas"></canvas>

          <!-- Interactive Brush Tip Indicator -->
          <div id="drawing-tip" class="drawing-tip">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L2 22h20L12 2z" fill="#ff4d6d" />
            </svg>
            <span class="tip-label">Ink...</span>
          </div>

          <!-- Japanese SFX floating element -->
          <div id="floating-sfx" class="floating-sfx">ゴゴゴ</div>
        </div>

        <!-- Minimal Draw Settings (Only visible when trace is active) -->
        <div class="trace-settings glass-panel" id="trace-settings">
          <div class="swatch-section">
            <button class="trace-swatch active" style="background-color: #ff4d6d;" data-color="#ff4d6d"></button>
            <button class="trace-swatch" style="background-color: #ffffff;" data-color="#ffffff"></button>
            <button class="trace-swatch" style="background-color: #00d4ff;" data-color="#00d4ff"></button>
          </div>
          <div class="slider-section">
            <i data-lucide="brush"></i>
            <input type="range" id="trace-brush-size" min="1" max="15" value="3">
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
